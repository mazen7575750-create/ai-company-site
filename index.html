<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>شركة الذكاء المستقلة — المقر الرئيسي</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#05080f;color:#e9eefb;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
#gl{position:fixed;inset:0;touch-action:none}
#gl canvas{display:block}
#loader{position:fixed;inset:0;z-index:60;background:radial-gradient(1000px 600px at 50% 35%,#14264d,#05080f 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;transition:opacity .7s}
#loader.done{opacity:0;pointer-events:none}
.spin{width:46px;height:46px;border-radius:50%;border:3px solid rgba(140,180,255,.2);border-top-color:#ffd94d;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#hint{position:fixed;bottom:16px;right:50%;transform:translateX(50%);z-index:15;background:rgba(8,14,28,.72);border:1px solid rgba(140,180,255,.18);color:#c7d5f2;font-size:11.5px;padding:8px 14px;border-radius:99px;pointer-events:none;opacity:0;transition:opacity .8s;max-width:92vw;text-align:center;backdrop-filter:blur(8px)}
#hint.show{opacity:1}
/* بطاقة فحص موظف */
#inspect{position:fixed;z-index:30;right:10px;left:10px;bottom:10px;max-width:640px;margin:auto;max-height:62vh;overflow:auto;background:rgba(9,15,30,.94);border:1px solid rgba(140,180,255,.28);border-radius:20px;padding:15px;backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(0,0,0,.6);display:none}
#inspect.open{display:block}
/* كمبيوتر المالك — نظام سطح مكتب عائم */
#os{position:fixed;z-index:50;width:min(95vw,900px);height:min(86vh,760px);right:50%;top:53%;transform:translate(50%,-50%);background:#0a1122;border:1px solid rgba(140,180,255,.35);border-radius:20px;overflow:hidden;display:none;flex-direction:column;box-shadow:0 40px 100px rgba(0,0,0,.75)}
#os.open{display:flex}
#osHead{background:linear-gradient(90deg,#1a2c57,#0c1730);padding:9px 12px;display:flex;align-items:center;gap:8px;cursor:grab;user-select:none;touch-action:none}
.dot3{width:11px;height:11px;border-radius:50%}
#osBody{flex:1;display:flex;min-height:0}
#osNav{width:172px;background:#0c1730;border-left:1px solid rgba(140,180,255,.14);padding:9px 7px;overflow:auto;display:flex;flex-direction:column;gap:4px}
#osNav button{text-align:right;border:0;background:transparent;color:#c3d2f2;padding:9px;border-radius:10px;font-size:12.5px;font-family:inherit;cursor:pointer}
#osNav button.active{background:#23407c;color:#fff}
#osMain{flex:1;overflow:auto;padding:14px;min-width:0}
@media(max-width:680px){#osBody{flex-direction:column}#osNav{width:100%;flex-direction:row;border-left:0;border-bottom:1px solid rgba(140,180,255,.14)}#osNav button{white-space:nowrap}}
.card{background:#101c38;border:1px solid rgba(140,180,255,.16);border-radius:14px;padding:12px;margin:0 0 10px}
.small{font-size:11.5px;color:#9db1da;line-height:1.7}.b{font-weight:800}
button{font-family:inherit}
.btn{border:1px solid rgba(140,180,255,.35);background:#1f3a75;color:#fff;border-radius:10px;padding:8px 13px;font-size:12.5px;cursor:pointer}
.btn.green{background:#145c38;border-color:#2bb673}.btn.red{background:#6e2230;border-color:#c04452}.btn.gold{background:#6f5410;border-color:#d9b23a}.btn.gray{background:#263356}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;background:#081127;color:#eef3ff;border:1px solid rgba(140,180,255,.3);border-radius:10px;padding:9px;font-family:inherit;font-size:13px}
label{font-size:11.5px;color:#aebfe6;display:block;margin:9px 0 4px}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.grow{flex:1}.sp{flex:1}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10.5px;border:1px solid rgba(160,190,255,.25);background:#22365f}
.badge.ok{background:#145c38}.badge.work{background:#6f5410}.badge.bad{background:#6e2230}.badge.wait{background:#24345c}.badge.review{background:#53307e}
.bar{height:8px;background:#081127;border-radius:99px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#4da3ff,#35d07f)}
pre.doc{white-space:pre-wrap;line-height:1.85;font-family:inherit;font-size:13px;background:#070f22;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.08)}
details{background:#0c1730;border-radius:11px;padding:8px 10px;margin:6px 0}summary{cursor:pointer;font-size:12.5px}
.chat{display:flex;flex-direction:column;gap:8px}.msg{max-width:90%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-start;background:#1e4e91}.msg.ceo{align-self:flex-end;background:#16294f;border:1px solid rgba(217,178,58,.35)}
.msg .who{font-size:10px;color:#ffd970;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pick{cursor:pointer}.pick:hover,.pick.sel{border-color:#4da3ff}
.warn{background:#3a2b05;border:1px solid #d9b23a;border-radius:12px;padding:10px;font-size:12px;line-height:1.8}
.err{background:#3d1420;border:1px solid #c04452;border-radius:12px;padding:10px;font-size:12px;line-height:1.8}
.okbox{background:#0e2e1f;border:1px solid #2bb673;border-radius:12px;padding:10px;font-size:12px;line-height:1.8}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}.kpi .card{text-align:center;margin:0}.kpi b{font-size:20px;display:block}
table{width:100%;border-collapse:collapse;font-size:11.5px}td,th{border-bottom:1px solid rgba(255,255,255,.08);padding:6px;text-align:right;vertical-align:top}
#modal{position:fixed;inset:0;z-index:80;background:rgba(2,5,12,.7);display:none;align-items:center;justify-content:center;padding:12px}
#modal.open{display:flex}#modalBox{width:min(95vw,760px);max-height:88vh;overflow:auto;background:#0b1428;border:1px solid rgba(140,180,255,.3);border-radius:18px;padding:16px}
#toast{position:fixed;bottom:78px;right:50%;transform:translateX(50%);z-index:100;background:#145c38;color:#fff;padding:9px 15px;border-radius:12px;font-size:12.5px;display:none;box-shadow:0 12px 30px #000;max-width:92vw;text-align:center}
img.art{width:100%;max-width:520px;display:block;margin:10px auto;border-radius:12px}
.xbtn{background:transparent;border:1px solid rgba(160,190,255,.3);color:#fff;border-radius:9px;padding:5px 9px;cursor:pointer}

/* ===== هوية بصرية جديدة لكمبيوتر المالك ===== */
#os{width:min(96vw,980px);height:min(88dvh,800px);top:50%;border-radius:26px;background:linear-gradient(150deg,rgba(18,29,58,.96),rgba(5,9,21,.97) 55%,rgba(12,20,43,.96));border:1px solid rgba(165,200,255,.42);box-shadow:0 34px 110px rgba(0,0,0,.74),0 0 0 1px rgba(255,255,255,.05) inset,0 20px 70px rgba(47,107,255,.18);backdrop-filter:blur(22px) saturate(145%)}
#os.open{animation:osIn .30s ease both}
@keyframes osIn{from{opacity:0;filter:blur(7px)}to{opacity:1;filter:blur(0)}}
#osHead{min-height:60px;padding:10px 14px;background:linear-gradient(90deg,rgba(49,87,176,.34),rgba(105,76,206,.18) 48%,rgba(255,255,255,.035));border-bottom:1px solid rgba(165,200,255,.18)}
.osBrand{display:flex;align-items:center;gap:10px;min-width:0}
.osLogo{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:21px;color:#fff;background:linear-gradient(145deg,#4da3ff,#7357e8 58%,#d4a72c);box-shadow:0 8px 22px rgba(77,163,255,.32),inset 0 1px 0 rgba(255,255,255,.35)}
.osBrand .t{line-height:1.25}.osBrand .t b{display:block;font-size:14px}.osBrand .t span{display:block;font-size:10.5px;color:#aebfe6;white-space:nowrap}
.osStatus{font-size:10.5px;color:#dbe7ff;background:rgba(255,255,255,.07);border:1px solid rgba(165,200,255,.2);padding:5px 9px;border-radius:99px;white-space:nowrap}
#osClock{font-size:11px;color:#aebfe6;white-space:nowrap}
.winDots{display:flex;gap:6px;margin-inline-start:4px}.winDots i{width:10px;height:10px;border-radius:50%;display:block}
#osSubbar{height:36px;padding:0 16px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.035);border-bottom:1px solid rgba(165,200,255,.12);font-size:11px;color:#aebfe6}
#osCrumb{color:#fff;font-weight:800;background:rgba(77,163,255,.14);border:1px solid rgba(77,163,255,.22);padding:4px 9px;border-radius:99px}
#osBody{background:radial-gradient(760px 430px at 15% -5%,rgba(77,163,255,.13),transparent 58%),radial-gradient(620px 390px at 95% 105%,rgba(212,167,44,.08),transparent 55%)}
#osNav{width:198px;padding:14px 10px;gap:6px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border-left:1px solid rgba(165,200,255,.13)}
.osProfile{display:flex;align-items:center;gap:9px;padding:10px;margin-bottom:8px;border:1px solid rgba(165,200,255,.16);border-radius:17px;background:linear-gradient(145deg,rgba(77,163,255,.16),rgba(115,87,232,.10))}
.osAvatar{width:36px;height:36px;flex:0 0 36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ffd94d,#d69a16);color:#1a1403;font-weight:900;box-shadow:0 7px 18px rgba(212,167,44,.25)}
.osProfile b{display:block;font-size:12px}.osProfile span{display:block;font-size:10px;color:#aebfe6;margin-top:2px}
.osNavLabel{font-size:10px;color:#7f93ba;padding:4px 9px 1px;font-weight:800}
#osNav button{padding:10px 11px;border:1px solid transparent;border-radius:14px;color:#cbd8f5;font-size:12.5px;font-weight:650;transition:background .18s,transform .18s,border-color .18s}
#osNav button:hover{background:rgba(255,255,255,.07);border-color:rgba(165,200,255,.15);transform:translateX(-2px)}
#osNav button.active{background:linear-gradient(135deg,#2f6bff,#7357e8);border-color:rgba(255,255,255,.22);color:#fff;box-shadow:0 10px 24px rgba(63,99,235,.28),inset 0 1px 0 rgba(255,255,255,.25)}
#osMain{padding:20px;scrollbar-width:thin;scrollbar-color:rgba(120,160,255,.45) transparent}
#osMain::-webkit-scrollbar,#osNav::-webkit-scrollbar,#inspect::-webkit-scrollbar{width:7px;height:7px}
#osMain::-webkit-scrollbar-thumb,#osNav::-webkit-scrollbar-thumb,#inspect::-webkit-scrollbar-thumb{background:rgba(120,160,255,.38);border-radius:99px}
#osMain h3{font-size:21px;margin:2px 0 14px;letter-spacing:-.2px}
#osMain h4{margin:4px 0 9px}
.card{background:linear-gradient(155deg,rgba(31,48,91,.94),rgba(11,19,40,.94));border:1px solid rgba(150,185,255,.19);border-radius:18px;padding:15px;box-shadow:0 14px 34px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.045)}
.kpi .card b{font-size:24px;background:linear-gradient(90deg,#fff,#9fd0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{border-radius:12px;padding:9px 14px;font-weight:750;background:linear-gradient(145deg,#2f6bff,#23479f);border-color:rgba(165,200,255,.38);box-shadow:0 8px 20px rgba(18,46,120,.28),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn.green{background:linear-gradient(145deg,#25b873,#11663d)}.btn.red{background:linear-gradient(145deg,#d84a5f,#7c2131)}.btn.gold{background:linear-gradient(145deg,#e4b93c,#8a6410)}.btn.gray{background:linear-gradient(145deg,#3b4d78,#223153)}
.xbtn{border-radius:11px;padding:7px 10px;background:rgba(255,255,255,.07);border-color:rgba(165,200,255,.25);font-size:11.5px}
input,select,textarea{background:rgba(3,8,20,.72);border-color:rgba(145,180,255,.25);border-radius:12px;padding:10px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:#6eb2ff;box-shadow:0 0 0 3px rgba(77,163,255,.16)}
details{background:rgba(4,10,24,.5);border:1px solid rgba(150,185,255,.12);border-radius:14px}
.badge{padding:3px 9px;font-weight:700}
pre.doc{background:rgba(3,8,20,.78);border-radius:15px}
#inspect{border-radius:24px;background:linear-gradient(155deg,rgba(17,29,58,.96),rgba(6,10,23,.96));border-color:rgba(165,200,255,.35);padding:17px;box-shadow:0 28px 75px rgba(0,0,0,.66),inset 0 1px 0 rgba(255,255,255,.05)}
#modalBox{background:linear-gradient(150deg,#111d3a,#070d1e);border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.72)}
@media(max-width:680px){
 #os{width:96vw;height:90dvh;border-radius:23px}.osBrand .t span{display:none}#osClock{display:none}.osStatus{display:none}
 #osBody{flex-direction:column}#osNav{width:100%;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;padding:9px;border-left:0;border-bottom:1px solid rgba(165,200,255,.13)}
 .osProfile{min-width:132px;margin:0}.osNavLabel{display:none}#osNav button{white-space:nowrap;padding:9px 10px}#osMain{padding:14px}
}

/* ===== واجهة اللاعب والتفاعل والكاميرات ===== */
#crosshair{position:fixed;left:50%;top:50%;z-index:18;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .25s,scale .15s}
#crosshair.show{opacity:.82}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:rgba(255,255,255,.92);box-shadow:0 1px 5px rgba(0,0,0,.8);border-radius:99px}
#crosshair:before{width:2px;height:18px;left:8px;top:0}
#crosshair:after{width:18px;height:2px;left:0;top:8px}
#crosshair.active{scale:1.35}
#crosshair.active:before,#crosshair.active:after{background:#ffd94d}
#interactPrompt{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,16px);z-index:22;display:flex;align-items:center;gap:9px;max-width:min(92vw,560px);border:1px solid rgba(255,217,77,.55);background:linear-gradient(145deg,rgba(20,28,50,.94),rgba(5,9,20,.94));color:#fff;border-radius:99px;padding:9px 13px 9px 16px;font-size:13px;font-weight:750;box-shadow:0 16px 42px rgba(0,0,0,.55),0 0 26px rgba(255,217,77,.13);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;cursor:pointer}
#interactPrompt.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#interactPrompt b{display:grid;place-items:center;min-width:34px;height:28px;padding:0 7px;border-radius:99px;background:linear-gradient(145deg,#ffd94d,#d69a16);color:#171106;font-size:11px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
#interactPrompt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#joyBase{position:fixed;z-index:19;width:118px;height:118px;margin:-59px 0 0 -59px;border:1.5px solid rgba(255,255,255,.32);background:radial-gradient(circle,rgba(255,255,255,.05),rgba(8,14,28,.18) 68%);border-radius:50%;opacity:0;pointer-events:none;transition:opacity .15s;backdrop-filter:blur(2px)}
#joyBase.show{opacity:1}
#joyNub{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(145,170,220,.75));box-shadow:0 8px 24px rgba(0,0,0,.38),inset 0 1px 0 #fff;transform:translate(-50%,-50%)}
.summonLayout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr);gap:12px;align-items:start}
.agentSummonGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.agentSummonGrid .card{margin:0}
.summonChatCard{position:sticky;top:0}
.summonAvatar{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:15px;background:color-mix(in srgb,var(--ac) 32%,#131f3a);border:1px solid var(--ac);font-size:21px}
.summonMsgs{max-height:330px;overflow:auto;padding:3px}
.cctvMain{padding:10px}
#cctvViewport{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:17px;background:#02050b;border:1px solid rgba(150,190,255,.24)}
#cctvCanvas{width:100%!important;height:100%!important;display:block;object-fit:cover}
.cctvTop{position:absolute;z-index:3;top:9px;right:10px;left:10px;display:flex;justify-content:space-between;gap:8px;color:#fff;font-size:11px;text-shadow:0 2px 8px #000;pointer-events:none}
.cctvTop b{color:#ffdf70}.cctvRec{position:absolute;z-index:3;bottom:9px;left:11px;color:#fff;background:rgba(160,0,22,.78);padding:3px 8px;border-radius:99px;font-size:10px;font-weight:900;letter-spacing:1px;animation:recBlink 1.25s steps(2,start) infinite}
@keyframes recBlink{50%{opacity:.25}}
.cctvControls{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:10px}
.cctvGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.cctvCard{border:1px solid rgba(150,185,255,.2);background:linear-gradient(155deg,rgba(31,48,91,.95),rgba(8,14,30,.97));border-radius:16px;padding:7px;color:#fff;text-align:right;cursor:pointer;overflow:hidden}
.cctvCard.sel{border-color:#ffd94d;box-shadow:0 0 0 1px rgba(255,217,77,.28),0 12px 30px rgba(0,0,0,.3)}
.cctvCard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:11px;background:radial-gradient(circle at 50% 30%,#21365f,#040814 72%)}
.cctvCard span{display:block;padding:7px 3px 2px}.cctvCard b{display:block;font-size:12px}.cctvCard small{display:block;color:#9db1da;margin-top:3px;line-height:1.55}
@media(max-width:860px){.summonLayout{grid-template-columns:1fr}.summonChatCard{position:static}.cctvGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.cctvCard b{font-size:10.5px}.cctvCard small{display:none}}
@media(max-width:520px){#interactPrompt{bottom:max(16px,env(safe-area-inset-bottom));font-size:12px}.agentSummonGrid{grid-template-columns:1fr}.cctvControls .btn{padding:7px 9px;font-size:11px}}

/* ===== طلبات المالك: نقطة فقط + اسم بلا خلفية + لانشر تطبيقات ===== */
#hint{display:none!important}
#crosshair{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.94);box-shadow:0 1px 5px rgba(0,0,0,.8);scale:1}
#crosshair:before,#crosshair:after{display:none!important}
#crosshair.active{background:#ffd94d;scale:1.35}
#lookLabel{position:fixed;left:50%;top:calc(50% + 15px);transform:translateX(-50%);z-index:18;max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;font-size:13px;font-weight:750;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.95),0 2px 14px rgba(0,0,0,.75);pointer-events:none;opacity:0;transition:opacity .15s}
#lookLabel.show{opacity:.97}
#interactPrompt{display:none!important}
.winDots{display:none!important}
#os{border-radius:20px}
#osBody{position:relative}
#osSubbar{gap:8px}
.osAppsBtn{min-width:104px;min-height:30px;border-radius:99px;background:linear-gradient(145deg,#2f6bff,#6548cf);border-color:rgba(190,215,255,.45);font-weight:800}
#osNav{position:absolute!important;top:0;bottom:0;right:0;width:min(340px,88%)!important;z-index:9;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start;overflow-y:auto!important;overflow-x:hidden!important;padding:14px!important;background:linear-gradient(160deg,rgba(20,32,64,.985),rgba(6,10,23,.985));border-left:1px solid rgba(165,200,255,.24);box-shadow:-22px 0 55px rgba(0,0,0,.42);transform:none;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .15s ease,visibility .15s ease}
#os.apps-open #osNav{transform:none;opacity:1;visibility:visible;pointer-events:auto}
#osNav .osProfile,#osNav .osNavLabel{grid-column:1/-1;min-width:0}
#osNav button{min-height:54px;display:flex;align-items:center;justify-content:flex-start;text-align:right;white-space:normal!important;line-height:1.45;border-radius:15px;padding:10px!important}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;text-align:center;line-height:1.45}
.row>.btn{flex:1 1 148px}
.cctvControls>.btn{flex:1 1 104px}
#osHead .xbtn{min-width:74px;min-height:34px}
#osMain{width:100%}
@media(max-width:680px){
 #osBody{flex-direction:row!important}
 #osNav{width:min(322px,88vw)!important;grid-template-columns:repeat(2,minmax(0,1fr))}
 #osNav .osProfile{display:flex}
 #osNav .osNavLabel{display:block}

  const options=[[pos.x,pos.z+1.9],[pos.x,pos.z-1.9],[pos.x+1.9,pos.z],[pos.x-1.9,pos.z],[pos.x+1.35,pos.z+1.35],[pos.x-1.35,pos.z+1.35]];
  const spot=options.find(([x,z])=>isWalkable(x,z,true))||[pos.x,pos.z+2.2];
  teleportPlayer(spot[0],spot[1],yawTo(spot[0],spot[1],pos.x,pos.z),-0.06);
}

function pointInBox(x,z,b,pad=0){return x>=b.x0-pad&&x<=b.x1+pad&&z>=b.z0-pad&&z<=b.z1+pad}
function isWalkable(x,z,ignoreRobots=false){
  if(x<BUILDING.x0+0.55||x>BUILDING.x1-0.55||z<BUILDING.z0+0.55||z>BUILDING.z1-0.55)return false;
  const r=0.31;
  for(const[ox,oz]of[[0,0],[r,0],[-r,0],[0,r],[0,-r],[r*.7,r*.7],[-r*.7,r*.7],[r*.7,-r*.7],[-r*.7,-r*.7]])if(cellBlockedAt(x+ox,z+oz))return false;
  for(const b of boxColliders)if(pointInBox(x,z,b,r))return false;
  for(const c of circleColliders)if(Math.hypot(x-c.x,z-c.z)<c.r+r)return false;
  for(const d of doorStates)if(Math.abs(d.angle)<0.42&&Math.abs(x-d.cx)<d.width/2+r&&Math.abs(z-d.z)<0.34+r)return false;
  if(!ignoreRobots)for(const id in robots){const p=robots[id].group.position;if(Math.hypot(x-p.x,z-p.z)<0.56)return false}
  return true;
}
function tryPlayerMove(dx,dz){
  if(dx&&isWalkable(player.pos.x+dx,player.pos.z))player.pos.x+=dx;
  if(dz&&isWalkable(player.pos.x,player.pos.z+dz))player.pos.z+=dz;
}
function standUp(){
  if(!player.sitting)return;
  if(player.sitExit){player.pos.x=player.sitExit.x;player.pos.z=player.sitExit.z}
  player.sitting=false;player.eye=1.62;player.sitExit=null;
}
function sitAt(x,z,yaw){
  if(player.sitting&&Math.hypot(player.pos.x-x,player.pos.z-z)<0.4){standUp();return}
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw);
  const dirs=[[fx,fz],[-fx,-fz],[-fz,fx],[fz,-fx]];
  let exit={x:x-fx*1.05,z:z-fz*1.05};
  for(const[dx,dz]of dirs){const ex=x+dx*1.05,ez=z+dz*1.05;if(isWalkable(ex,ez,true)){exit={x:ex,z:ez};break}}
  player.pos.x=x;player.pos.z=z;player.yaw=yaw;player.pitch=-0.02;player.eye=1.16;player.sitting=true;
  player.sitExit=exit;player.yOff=0;player.vy=0;setPlayerView();
}

let audioCtx=null;
function uiSound(freq=660,dur=0.055,type="sine",vol=0.022){
  try{
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
  }catch{}
}
function updatePlayer(dt){
  const ui=isUiOpen();
  let forward=0,right=0;
  if(!ui){
    forward=(keys.has("KeyW")||keys.has("ArrowUp")?1:0)-(keys.has("KeyS")||keys.has("ArrowDown")?1:0)-joyVec.y;
    right=(keys.has("KeyD")||keys.has("ArrowRight")?1:0)-(keys.has("KeyA")||keys.has("ArrowLeft")?1:0)+joyVec.x;
  }
  const mag=Math.hypot(forward,right);
  if(player.sitting&&mag>0.16)standUp();
  if(mag>0.03&&!ui){
    forward/=Math.max(1,mag);right/=Math.max(1,mag);
    const sprint=(keys.has("ShiftLeft")||keys.has("ShiftRight"))?1.62:1;
    const speed=(+cfg.walkSpeed||4.25)*sprint;
    const fx=-Math.sin(player.yaw),fz=-Math.cos(player.yaw),rx=Math.cos(player.yaw),rz=-Math.sin(player.yaw);
    const moveX=(fx*forward+rx*right)*speed*dt,moveZ=(fz*forward+rz*right)*speed*dt,steps=Math.max(1,Math.ceil(Math.hypot(moveX,moveZ)/0.16));
    for(let step=0;step<steps;step++)tryPlayerMove(moveX/steps,moveZ/steps);
    player.bobPhase+=dt*(sprint>1?10.5:8);player.bob=Math.sin(player.bobPhase)*0.028;
  }else player.bob*=0.82;
  if(player.yOff>0||player.vy!==0){player.vy-=13.5*dt;player.yOff+=player.vy*dt;if(player.yOff<=0){player.yOff=0;player.vy=0}}
  setPlayerView();
}
document.addEventListener("pointerlockchange",()=>{pointerLocked=document.pointerLockElement===renderer.domElement});
renderer.domElement.addEventListener("pointerdown",e=>{
  if(isUiOpen())return;
  try{renderer.domElement.setPointerCapture(e.pointerId)}catch{}
  if(e.pointerType==="mouse"){
    if(!pointerLocked&&!IS_MOBILE){try{const p=renderer.domElement.requestPointerLock();if(p?.catch)p.catch(()=>{})}catch{}}
    lookPointer={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:e.timeStamp,mouse:true};
  }else if(e.clientX<innerWidth*0.46&&joyPointer===null){
    joyPointer=e.pointerId;joyOrigin={x:e.clientX,y:e.clientY,t:e.timeStamp};joyVec.x=0;joyVec.y=0;
    const b=$("joyBase"),n=$("joyNub");b.style.left=e.clientX+"px";b.style.top=e.clientY+"px";b.classList.add("show");n.style.transform="translate(-50%,-50%)";
  }else{

renderer.domElement.addEventListener("pointermove",e=>{
  if(isUiOpen())return;
  const sens=(+cfg.mouseSens||1)*0.00215;
  if(pointerLocked&&e.pointerType==="mouse"){
    player.yaw-=e.movementX*sens;player.pitch=clamp(player.pitch-e.movementY*sens,-1.32,1.32);return;
  }
  if(e.pointerId===joyPointer&&joyOrigin){
    let dx=e.clientX-joyOrigin.x,dy=e.clientY-joyOrigin.y;const d=Math.hypot(dx,dy),max=56;
    if(d>max){dx*=max/d;dy*=max/d}joyVec.x=dx/max;joyVec.y=dy/max;
    $("joyNub").style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
  }else if(lookPointer&&e.pointerId===lookPointer.id){
    const dx=e.clientX-lookPointer.x,dy=e.clientY-lookPointer.y;lookPointer.x=e.clientX;lookPointer.y=e.clientY;
    player.yaw-=dx*sens*1.85;player.pitch=clamp(player.pitch-dy*sens*1.85,-1.32,1.32);
  }
});
function endPointer(e){
  if(e.pointerId===joyPointer){const quickJoy=joyOrigin&&Math.hypot(e.clientX-joyOrigin.x,e.clientY-joyOrigin.y)<12;joyPointer=null;joyOrigin=null;joyVec.x=0;joyVec.y=0;$("joyBase").classList.remove("show");if(quickJoy&&!isUiOpen())interactFocused()}

addEventListener("keydown",e=>{

const _focusTmp=new THREE.Vector3();let lookOnlyInteractable=null;
function updateInteractionFocus(nowMs){
  const cross=$("crosshair"),label=$("lookLabel");
  if(isUiOpen()){focusedInteractable=null;lookOnlyInteractable=null;focusBox.visible=false;cross.classList.remove("show","active");label.classList.remove("show");label.textContent="";return}
  cross.classList.add("show");
  if(nowMs-lastFocusCheck<130)return;lastFocusCheck=nowMs;
  ray.setFromCamera(centerPtr,camera);ray.far=38;
  const candidates=[];
  for(const item of interactables){
    item.root.getWorldPosition(_focusTmp);
    const dist=Math.hypot(_focusTmp.x-player.pos.x,_focusTmp.z-player.pos.z);
    if(dist<=(item.labelDistance||item.maxDistance||3.4)+2.4)candidates.push(item.root);
  }
  const hits=candidates.length?ray.intersectObjects(candidates,true):[];
  let occDist=Infinity;
  if(hits.length&&occluderMeshes.length){const maxHit=hits[hits.length-1].distance,origin=ray.ray.origin,dir=ray.ray.direction,nearOcc=[];for(const mesh of occluderMeshes){const m=mesh.userData.occ;if(!m)continue;const vx=m.x-origin.x,vy=m.y-origin.y,vz=m.z-origin.z,along=vx*dir.x+vy*dir.y+vz*dir.z;if(along<-m.r||along>maxHit+m.r)continue;const d2=vx*vx+vy*vy+vz*vz-along*along;if(d2<m.r*m.r)nearOcc.push(mesh)}if(nearOcc.length)occDist=ray.intersectObjects(nearOcc,false)[0]?.distance??Infinity}
  let found=null,look=null;
  for(const h of hits){
    if(h.distance>occDist+0.12)continue;
    let o=h.object,id=o.userData.interactId;
    while(id===undefined&&o.parent){o=o.parent;id=o.userData.interactId}
    if(id===undefined)continue;
    const item=interactables[id];if(!item)continue;
    if(h.distance<=(item.maxDistance||3.4)){found=item;break}
    if(item.lookLabel&&h.distance<=(item.labelDistance||0)){look=item;break}
  }
  focusedInteractable=found;lookOnlyInteractable=found?null:look;focusBox.visible=false;
  cross.classList.toggle("active",!!found);
  const txt=found?interactLabel(found):(look?lookLabelText(look):"");
  label.textContent=txt;label.classList.toggle("show",!!txt);
}

function updateDoors(dt){

function updateCctvCamera(def){
  const cam=cctvCameras[def.id];if(!cam)return;
  const dx=def.look[0]-def.pos[0],dy=def.look[1]-def.pos[1],dz=def.look[2]-def.pos[2];

  cctvFixtures[def.id]?.head.lookAt(def.pos[0]+fx*6,def.pos[1]+fy*6,def.pos[2]+fz*6);
}

/* تجميع الهندسة الثابتة غير التفاعلية حسب الخامة والمنطقة لتقليل نداءات الرسم */
function batchStaticMeshes(){
  scene.updateMatrixWorld(true);
  const dyn=new Set();dynamicObjects.forEach(r=>r.traverse(o=>dyn.add(o)));Object.values(robots).forEach(r=>r.group.traverse(o=>dyn.add(o)));ownerAvatar.traverse(o=>dyn.add(o));
  const groups=new Map(),pos=new THREE.Vector3();
  scene.traverse(o=>{
    if(!o.isMesh||dyn.has(o)||o.userData.interactId!==undefined||o===ceiling||o===ground||o===slab)return;
    const mat=o.material;if(!mat||Array.isArray(mat)||mat.transparent||mat.visible===false||!o.geometry?.attributes?.position)return;
    o.getWorldPosition(pos);if(pos.y<0.04)return;
    const key=mat.uuid+"|"+(o.castShadow?1:0)+"|"+(o.receiveShadow?1:0)+"|"+Math.floor(pos.x/14)+"|"+Math.floor(pos.z/14);
    if(!groups.has(key))groups.set(key,{mat,cast:o.castShadow,receive:o.receiveShadow,geos:[],src:[]});
    const gr=groups.get(key);gr.geos.push(_cleanGeoForMerge(o.geometry,o.matrixWorld));gr.src.push(o);
  });
  let merged=0,created=0;
  for(const gr of groups.values()){
    if(gr.geos.length<2)continue;let geo=null;try{geo=mergeGeometries(gr.geos,false)}catch{}
    if(!geo)continue;const m=new THREE.Mesh(geo,gr.mat);m.castShadow=gr.cast;m.receiveShadow=gr.receive;m.matrixAutoUpdate=false;m.updateMatrix();scene.add(m);created++;merged+=gr.src.length;gr.src.forEach(o=>o.removeFromParent());
  }
  window.__staticBatch={merged,created};
}
batchStaticMeshes();

const detailCull=[],occluderMeshes=[];let detailCullFrame=-999,detailCullX=1e9,detailCullZ=1e9;
{

  const box=new THREE.Box3(),size=new THREE.Vector3(),center=new THREE.Vector3();
  scene.traverse(o=>{
    if(!o.isMesh||dyn.has(o)||o===ceiling||o===ground||o===slab)return;
    box.setFromObject(o);box.getSize(size);const maxDim=Math.max(size.x,size.y,size.z);box.getCenter(center);
    if((maxDim>0&&maxDim<0.68)||o.userData.detailCull)detailCull.push({mesh:o,x:center.x,z:center.z});
    if(maxDim>=1.0&&o.userData.interactId===undefined&&!o.material?.transparent&&center.y>0.12&&center.y<3.3){o.userData.occ={x:center.x,y:center.y,z:center.z,r:Math.max(.35,Math.hypot(size.x,size.y,size.z)/2)};occluderMeshes.push(o)}
  });
}
function updateDetailCull(force=false){
  const moved=Math.hypot(player.pos.x-detailCullX,player.pos.z-detailCullZ);
  if(!force&&frameNo-detailCullFrame<24&&moved<2)return;
  detailCullFrame=frameNo;detailCullX=player.pos.x;detailCullZ=player.pos.z;
  const R=QUALITY.detail,R2=R*R;
  for(const d of detailCull){const dx=d.x-player.pos.x,dz=d.z-player.pos.z;d.mesh.visible=dx*dx+dz*dz<R2}
}

[sun,sun.target,lobbyLight,...nightLights,ownerRing,ownerBeacon,ownerAvatar,focusBox,guideLine].forEach(o=>o.traverse?o.traverse(x=>x.matrixAutoUpdate=true):o.matrixAutoUpdate=true);
dynamicObjects.forEach(root=>root.traverse(o=>o.matrixAutoUpdate=true));
Object.values(robots).forEach(r=>r.group.traverse(o=>o.matrixAutoUpdate=true));
scene.updateMatrixWorld(true);

/* ================= الحلقة ================= */
const clock=new THREE.Clock();let frameNo=0,perfTime=0,perfFrames=0,lastUiFrame=0,perfWindowStart=performance.now(),perfRendered=0,slowPerfWindows=0;
setInterval(()=>{const c=$("osClock");if(c)c.textContent=new Date().toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"})},1000);
function animate(){
  requestAnimationFrame(animate);
  const nowMs=performance.now(),uiOpen=isUiOpen();
  if(document.hidden)return;
  if(uiOpen&&nowMs-lastUiFrame<((typeof curApp!=="undefined"&&curApp==="cameras")?80:180)){renderCctvIfNeeded(nowMs);return}
  lastUiFrame=nowMs;
  const rawDt=clock.getDelta(),dt=Math.min(rawDt,0.05),moveDt=Math.min(rawDt,0.12),t=clock.elapsedTime;frameNo++;perfTime+=dt;perfFrames++;
  if(renderer.shadowMap.enabled&&frameNo%10===0)renderer.shadowMap.needsUpdate=true;
  updatePlayer(moveDt);updateDoors(dt);updateInteractionFocus(performance.now());updateAmbientInteractions(t,dt);
  if(frameNo%12===0)updateBubbles();
  for(const id in robots){const r=robots[id];if(frameNo%15===0){const near=r.group.position.distanceToSquared(player.pos)<(LOW_POWER?169:289);if(r.lodNear!==near){r.lodNear=near;r.lodParts?.forEach(p=>p.visible=near)}}moveRobot(r,moveDt);poseRobot(r,t)}
  ownerRing.scale.setScalar(1+Math.sin(t*2.2)*0.08);ownerRing.position.y=0.06+Math.sin(t*2.2)*0.015;
  const beaconDist=Math.hypot(player.pos.x-OWNER_DESK.x,player.pos.z-OWNER_DESK.z);ownerBeacon.visible=beaconDist>10;ownerBeaconMat.opacity=0.055+Math.sin(t*2.2)*0.018;ownerBeacon.rotation.y=t*0.35;
  summonRings.forEach((r,i)=>{if(r.visible)r.scale.setScalar(1+Math.sin(t*3+i)*0.07)});
  updateLighting(dt);updateDetailCull();
  renderer.render(scene,camera);renderCctvIfNeeded(nowMs);
  if(!uiOpen){perfRendered++;if(nowMs-perfWindowStart>=1200){const fps=perfRendered*1000/Math.max(1,nowMs-perfWindowStart);perfRendered=0;perfWindowStart=nowMs;if(fps<30){slowPerfWindows++;if(slowPerfWindows>=2&&pixelRatioCap>MIN_PIXEL_RATIO){pixelRatioCap=Math.max(MIN_PIXEL_RATIO,pixelRatioCap*.92);applyQualityProfile();slowPerfWindows=0}}else{slowPerfWindows=0;if(fps>57&&pixelRatioCap<MAX_PIXEL_RATIO){pixelRatioCap=Math.min(MAX_PIXEL_RATIO,pixelRatioCap*1.05);applyQualityProfile()}}}}else{perfRendered=0;perfWindowStart=nowMs;slowPerfWindows=0}
}
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.fov=camera.aspect<0.75?94:(camera.aspect<1.1?82:71);camera.updateProjectionMatrix();applyQualityProfile();});
window.__booted=true;
animate();poll().then(()=>{setTimeout(()=>$("loader").classList.add("done"),500)});
setTimeout(()=>$("loader").classList.add("done"),2600);
hint(IS_MOBILE?"أنت داخل الشركة: النصف الأيسر للمشي والأيمن للنظر • اقترب من أي شيء ثم المس زر التفاعل • مكتبك وكمبيوتر الإدارة في الشمال الغربي":"أنت داخل الشركة: WASD للمشي والماوس للنظر وE للتفاعل • مكتبك وكمبيوتر الإدارة والاستدعاء والكاميرات في الشمال الغربي",false);
</script>
